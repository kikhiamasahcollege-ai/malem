name: Verify Malem

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release preflight
        env:
          MALEM_BASELINE_REF: origin/claude/travel-profile-itinerary-7a08ju
        run: node scripts/release-preflight.mjs --require-clean
