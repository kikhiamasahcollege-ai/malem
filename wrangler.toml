# malem — Cloudflare Pages + Functions + D1 config.
name = "malem"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# Production requires the `malem-db` D1 database to be bound as `DB` in the
# Cloudflare Pages project settings. Keep its account-specific resource ID out
# of this public repository. For a private or local Wrangler configuration:
# [[d1_databases]]
# binding = "DB"
# database_name = "malem-db"
# database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"
