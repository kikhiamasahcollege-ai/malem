# malem — Cloudflare Pages + Functions + D1 config.
name = "malem"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# --- Backend phase only (leave commented until you wire real accounts) ---
# The frontend still uses localStorage, so no D1 binding is needed to deploy.
# When you build accounts: run `wrangler d1 create malem-db`, paste the printed
# database_id below, apply schema.sql, then uncomment this block.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "malem-db"
# database_id = "PASTE_AFTER_wrangler_d1_create"
