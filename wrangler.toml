# malem — Cloudflare Pages + Functions + D1 config.
name = "malem"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

[vars]
PUBLIC_BASE_URL = "https://malemtravel.com"
OPENROUTER_APP_TITLE = "malem"

# Cloudflare resource IDs are deployment identifiers, not credentials. Keeping
# this binding in source control prevents Wrangler deployments from replacing
# the production Pages configuration with an unbound Function.
[[d1_databases]]
binding = "DB"
database_name = "malem-db"
database_id = "65334172-4293-4ff6-92b5-36e8aec5d0c3"
