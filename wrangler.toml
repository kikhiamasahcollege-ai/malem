# malem — Cloudflare Pages + Functions + D1 config.
name = "malem"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# Version 7 requires a D1 database bound as DB. For Pages deployments, add the
# binding in Cloudflare > Workers & Pages > malem > Settings > Bindings.
# For Wrangler-managed deployments, create the database, apply schema.sql, and
# add the account-specific id in this block:
# [[d1_databases]]
# binding = "DB"
# database_name = "malem-db"
# database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"
